# --------------------------------------------
# NumericExport Nginx configuration sécurisée (FULL)
# --------------------------------------------

# ----------------- HTTP → HTTPS -----------------
server {
    listen 80;
    server_name api.numericexport.com dashboard.numericexport.com numericexport.com www.numericexport.com;
    return 301 https://$host$request_uri;
}

# ----------------- API -----------------
server {
    listen 443 ssl http2;
    server_name api.numericexport.com;

    ssl_certificate /etc/letsencrypt/live/numericexport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numericexport.com/privkey.pem;

    # Sécurité SSL (Correction de la ponctuation de ton fichier 2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs (Vérifie que le dossier /var/log/numericexport existe !)
    access_log /var/log/numericexport/api-access.log;
    error_log /var/log/numericexport/api-error.log;

    # Sécurité fichiers sensibles (Inclus de ton fichier 2)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(php|aspx|jsp|cgi|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Limites & Headers (Inclus de ton fichier 2)
    client_max_body_size 10M;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        limit_req zone=one burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ----------------- DASHBOARD -----------------

server {
    listen 443 ssl http2;
    server_name dashboard.numericexport.com;

    ssl_certificate /etc/letsencrypt/live/numericexport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numericexport.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/numericexport/dashboard-access.log;
    error_log /var/log/numericexport/dashboard-error.log;

    # --- AJOUT CRITIQUE : Fichiers statiques Next.js ---
    location ^~ /_next/static/ {
        alias /var/www/numericexport/dashboard/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/media/ {
        alias /var/www/numericexport/dashboard/.next/static/media/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Protections (Fichiers sensibles & Headers)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(php|aspx|jsp|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        limit_req zone=one burst=20 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ----------------- VITRINE -----------------
server {
    listen 443 ssl http2;
    server_name numericexport.com www.numericexport.com;

    ssl_certificate /etc/letsencrypt/live/numericexport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numericexport.com/privkey.pem;

    access_log /var/log/numericexport/vitrine-access.log;
    error_log /var/log/numericexport/vitrine-error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # SEO : Rediriger www vers non-www
    if ($host = "www.numericexport.com") {
        return 301 https://numericexport.com$request_uri;
    }

    location / {
        limit_req zone=one burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
